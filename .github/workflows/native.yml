name: Native

on:
  push:
    # Every branch, not just `master`. A fork's work happens on branches and
    # this project does not open pull requests from them, so a master-only
    # trigger means a branch's first CI run is also its first review.
    branches: ["**"]
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # macOS hosted arm64 runners are starved on this fork: the job is
      # cancelled without ever being assigned a runner, so it takes the whole
      # run down without testing anything. `continue-on-error` does not help —
      # it covers a job that failed, not one that was cancelled. The canonical
      # repository does get a runner, so its matrix keeps all three platforms;
      # a fork runs the two it can actually run. `github.repository` is the
      # repository the workflow runs in, so a pull request from a fork still
      # resolves to the base repository and gets the full matrix.
      matrix:
        os: ${{ fromJSON(github.repository == 'p2r3/convert' && '["windows-latest", "macos-latest", "ubuntu-latest"]' || '["windows-latest", "ubuntu-latest"]') }}

    defaults:
      run:
        working-directory: native

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # `libgtk-3-dev` drags in everything the window links against, but the
      # X11 keymap bridge is dlopened at startup rather than linked, so it is
      # invisible to the linker and to `cargo build`. `libxkbcommon-dev` ships
      # the headers and `libxkbcommon.so`; the library the app actually asks
      # for is `libxkbcommon-x11.so.0`, which only `libxkbcommon-x11-0`
      # provides. Without it the release binary panics on first launch on a
      # machine that has exactly this list installed.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libxrandr-dev libxi-dev libxcursor-dev

      # The real-ffmpeg tests skip when no ffmpeg is on PATH. Installing it
      # here means they run instead of skip, and CONVERT2IT_REQUIRE_FFMPEG
      # below turns a missing one into a failure rather than a green run that
      # exercised nothing.
      - name: Install ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ffmpeg

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test
        env:
          # Only the Linux job is guaranteed an ffmpeg, because it installs one
          # above. On the other two platforms a missing ffmpeg is a skip.
          CONVERT2IT_REQUIRE_FFMPEG: ${{ runner.os == 'Linux' && '1' || '' }}

      - name: Build release
        run: cargo build --release
