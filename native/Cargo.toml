[package]
name = "convert-to-it-native"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Native Rust desktop app for Convert to it!"

[dependencies]
# Brotli is the WOFF2 compressed-data codec; it is pure Rust.
brotli = "9"
# Excel and OpenDocument workbooks. `calamine` (MIT, pure Rust, no build script)
# reads xlsx, the legacy BIFF8 xls and ods with one reader: shared strings are
# resolved, cells keep their type and a date arrives as its serial plus the
# format, which its own `ExcelDateTime` turns into components. Its `chrono`
# feature is off because those components are all this app needs.
calamine = "0.38"
claxon = "0.4"
csv = "1.3"
# `accesskit` publishes the widget tree to the platform's accessibility API
# (UI Automation on Windows), which is what makes the window usable by screen
# readers and by external automation. It is not part of eframe's default set
# here because `default-features` is off.
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
# Symphonia 0.5 has no AC-3/E-AC-3 codec feature; filmcraft-ac3 provides both
# decoders and is wired into track probing for raw, Matroska and MP4 input.
filmcraft-ac3 = "0.9"
flacenc = "0.5"
flate2 = "1"
# AVIF and HEIC decoding. `gamut-avif` walks the AVIF container and hands the
# AV1 codestream to `rav1d`, the pure-Rust port of `dav1d`; `heifer` decodes
# HEIC, HEVC codestream included, in pure Rust. `rav1d`'s `asm` feature
# assembles the vendored x86 assembly with NASM, which would be a build-time
# tool outside Rust, so the portable Rust paths are used; `heifer` is built
# without its default `encoder` feature because only decoding is needed.
gamut-avif = "2.0.0"
gamut-core = "3.0.0"
# PDF page rasterisation. `hayro` is a pure-Rust PDF interpreter and CPU
# rasteriser (Apache-2.0 OR MIT) whose default features bundle permissively
# licensed substitutes for the 14 standard fonts and the predefined CMaps,
# so a PDF that embeds nothing still draws real glyphs.
hayro = "0.9.0"
# PDF page vectorisation. `hayro-svg` is the same project's SVG backend
# (Apache-2.0 OR MIT): it walks the interpreted page and writes an SVG document
# instead of a bitmap. Its `embed-fonts`/`embed-cmaps` defaults mirror `hayro`'s,
# so a page that embeds nothing still outlines real glyphs.
hayro-svg = "0.9.0"
heifer = { version = "0.5.1", default-features = false }
# EPUB reading and writing. `rbook` parses the container, the OPF package and
# the spine for EPUB 2 and 3, and writes the same structure back; every byte of
# it is pure Rust. It is built without its default `threadsafe` and `prelude`
# features because neither is used here, and with `write` because building an
# EPUB needs the writer.
rbook = { version = "0.7.13", default-features = false, features = ["write"] }
# HTML and XHTML parsing for the text, Markdown and EPUB paths. `html5ever` is
# the browser-grade parser: it applies the implied end tags, entity decoding and
# table fix-ups a tolerant reader needs. `markup5ever_rcdom` supplies the tree
# those document walks traverse; it is documented as basic and unsupported,
# which is fine for reading a tree, and is the only published DOM for this
# parser.
html5ever = "0.40"
markup5ever_rcdom = "0.40"
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "dds",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
] }
mp3lame-encoder = "0.3"
opus-pure = "0.2.3"
pdf-extract = "0.12"
pdf-writer = "0.15"
# WordprocessingML, PresentationML and OpenDocument text are read directly on
# `quick-xml` (MIT, pure Rust) over the ZIP package the archive path already
# opens. The parts this app needs are a handful of elements each, so a format
# crate with its own document model, its own ZIP and its own XML stack would be
# a second reader for no gain: `docx-rs` and `docx-rust` are writers first, and
# `umya-spreadsheet` would duplicate `calamine`'s job with twenty more crates.
quick-xml = "0.42"
# Markdown input is parsed as CommonMark with the tables, footnotes,
# strikethrough and task-list extensions GitHub-flavoured Markdown adds. Its
# HTML is read back into the same tree the HTML path uses, so there is one
# XHTML writer for both.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rav1d = { version = "1.1.0", default-features = false, features = [
    "bitdepth_8",
    "bitdepth_16",
] }
# RAR and 7z are input-only: `rars` decodes RAR and `sevenz-rust2` decodes 7z,
# so a CBR or CB7 comic can be re-packed as a CBZ. Both are pure Rust with no
# `build.rs`, no C library and no network call. `rars` keeps only its decoders
# plus the crypto checks that make an encrypted archive report itself as
# encrypted; `sevenz-rust2` keeps its decoders plus the codecs that are pure
# Rust here — its `bzip2` feature uses the crate's default `libbz2-rs-sys`
# backend, and `zstd` is left out because that one binds the C library.
rars = { version = "0.13", default-features = false, features = ["encryption"] }
rfd = "0.15"
resvg = "0.50"
sevenz-rust2 = { version = "0.25", default-features = false, features = [
    "aes256",
    "brotli",
    "bzip2",
    "deflate",
    "lz4",
    "ppmd",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
symphonia = { version = "0.5", features = ["aac", "aiff", "alac", "isomp4", "mp3"] }
tar = "0.4"
thiserror = "2"
# TIFF output writes its EXIF tags and ICC profile itself. `image`'s TIFF
# encoder can attach an ICC profile but writes no EXIF tags at all, while the
# `tiff` writer it is built on (already in the tree through `image`, pure Rust,
# MIT) can write arbitrary tags into the image directory. This is a direct
# dependency for that one call path; it adds no new crate to the lock.
tiff = "0.11"
toml = "1.2"
ttf-parser = "0.25"
webbrowser = "1.2"
# wuff decodes WOFF and WOFF2 (including the WOFF2 glyf transform) in pure Rust.
wuff = "0.2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# Builds the AVIF container the EXIF-orientation test reads, so that test does
# not need a committed fixture with an orientation tag.
gamut-isobmff = "3.0.0"
winit = { version = "0.30", default-features = false }
