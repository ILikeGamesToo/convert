[package]
name = "convert-to-it-native"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Native Rust desktop app for Convert to it!"

[dependencies]
claxon = "0.4"
csv = "1.3"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
flacenc = "0.5"
flate2 = "1"
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "dds",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
] }
rfd = "0.15"
resvg = "0.50"
serde_json = "1"
serde_yaml_ng = "0.10"
symphonia = { version = "0.5", features = ["aac", "alac", "isomp4", "mp3"] }
tar = "0.4"
thiserror = "2"
toml = "1.2"
webbrowser = "1.2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
